# Every push and pull request runs the whole suite in a real browser -- Chromium,
# WebKit (Safari's engine) and Firefox -- the same ./tests/run.sh as a local `npm test`,
# so a PR shows green or red.
#
# Also checked: mod.js parses, the committed userscript was rebuilt from it, and
# the author's two files are untouched (his changelog byte for byte, index.html
# his plus the one script tag) against his repository, fetched read-only.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # WebKit is the engine Safari is built on: it is what caught the skill rows
    # wrapping under a classic scrollbar, which Chromium alone never showed.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    name: tests (${{ matrix.browser }})
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The browsers are ~100-200 MB each and downloaded on every run. Keyed on the
      # lockfile (which pins the Playwright version, and so the browser build);
      # `install` below is a no-op for the download when this hits, but still
      # adds the OS libraries, which are not in the cache.
      - name: Cache the browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: mod.js parses, userscript current
        run: npm run check

      - name: The author's files are his
        run: ./tests/authorfiles.sh

      - name: Test suite
        run: npm test
